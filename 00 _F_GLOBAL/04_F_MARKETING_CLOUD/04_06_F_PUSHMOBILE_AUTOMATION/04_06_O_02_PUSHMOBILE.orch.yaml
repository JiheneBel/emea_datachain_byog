type: "orchestration"
version: "1.0"
pipeline:
  components:
    Start 0:
      type: "start"
      transitions:
        unconditional:
        - "Query Result To Scalar 0"
      skipped: false
      parameters:
        componentName: "Start 0"
    Data Transfer 0:
      type: "data-transfer-object"
      transitions:
        success:
        - "S3 Load 0"
      skipped: false
      parameters:
        componentName: "Data Transfer 0"
        sourceType: "SFTP"
        setHomeDirectoryAsRoot1: "No"
        sourceUrl6: "sftp://${v_user_2}@${v_host_2}/Export/DataChain/vpvpb_pushmobile_${date_du_jour}"
        sourceUsername3: "${v_user_2}"
        sourcePassword3: ""
        sourceSftpKey: ""
        unpackZipFile: "Yes"
        targetType: "S3"
        gzipData: "No"
        targetUrl2: "s3://jp-prod-datachain/Marketing-Cloud/PushMobile/"
        accessControlListOptions: ""
        encryption: "None"
    Query Result To Scalar 0:
      type: "query-to-scalar"
      transitions:
        success:
        - "show path"
      skipped: false
      parameters:
        componentName: "Query Result To Scalar 0"
        mode: "Advanced"
        query: "/* Note: this query will be run as a subquery for the purposes of\
          \ sampling the data.\n   As such it will be restricted by any subquery limitations\
          \ specified by the current platform. */\n   \n   \n  SELECT  replace (to_varchar(date(current_date()\
          \ - INTERVAL  '1 DAY')) , '-', '') as date_du_jour"
        scalarVariableMapping:
        - - "date_du_jour"
          - "DATE_DU_JOUR"
    show path:
      type: "python-script"
      transitions:
        success:
        - "Data Transfer 0"
      skipped: false
      parameters:
        componentName: "show path"
        script: "###\n# Variables are directly accessible: \n#   print (myvar)\n#\
          \ Updating a variable:\n#   context.updateVariable('myvar', 'new-value')\n\
          # Grid Variables are accessible via the context:\n#   print (context.getGridVariable('mygridvar'))\n\
          # Updating a grid variable:\n#   context.updateGridVariable('mygridvar',\
          \ [['list','of'],['lists','!']])\n# A database cursor can be accessed from\
          \ the context (Jython only):\n#   cursor = context.cursor()\n#   cursor.execute('select\
          \ count(*) from mytable')\n#   rowcount = cursor.fetchone()[0]\n###\nprint\
          \ ('sftp://' + str (v_user_2) +'@'+ str (v_host_2) +'/Export/DataChain/vpvpb_pushmobile_'\
          \ + str (date_du_jour))"
        interpreter: "Python 3"
        timeout: "360"
    S3 Load 0:
      type: "s3-load"
      transitions:
        success:
        - "TMP TABLE  & CALCU HASH_ID ANCIENNE TABLE"
      skipped: false
      parameters:
        componentName: "S3 Load 0"
        stage: "[Custom]"
        authentication: "Credentials"
        s3ObjectPrefix: "s3://jp-prod-datachain/Marketing-Cloud/"
        pattern: ".*MobilePushDetailExtractReport.csv"
        encryption: "None"
        warehouse: "[Environment Default]"
        database: "[Environment Default]"
        schema: "STG"
        targetTable: "PUSHMOBILE_AUTOMATION"
        loadColumns:
        - "AppName"
        - "MessageName"
        - "MessageID"
        - "Campaigns"
        - "DeviceId"
        - "DateTimeSend"
        - "MessageContent"
        - "MessageOpened"
        - "OpenDate"
        - "TimeInApp"
        - "Platform"
        - "PlatformVersion"
        - "Status"
        - "ServiceResponse"
        - "GeofenceName"
        - "Template"
        - "Format"
        - "PageName"
        - "PushJobId"
        - "SystemToken"
        - "InboxMessageDownloaded"
        - "InboxMessageOpened"
        - "IosMediaUrl"
        - "AndroidMediaUrl"
        - "MediaAlt"
        - "ContactKey"
        - "RequestId"
        format: "[Custom]"
        fileType: "CSV"
        compression: "AUTO"
        recordDelimiter: ""
        fieldDelimiter: ","
        skipHeader: "1"
        skipBlankLines: "False"
        dateFormat: ""
        timeFormat: ""
        timestampFormat: ""
        escape: ""
        escapeUnenclosedField: ""
        trimSpace: "False"
        fieldOptionallyEnclosed: "\""
        nullIf:
        errorOnColumnCountMismatch: "False"
        emptyFieldAsNull: "True"
        replaceInvalidCharacters: "False"
        encodingType: ""
        onError: "Abort Statement"
        sizeLimitB: ""
        purgeFiles: "False"
        truncateColumns: "False"
        forceLoad: "False"
    insert into ODS:
      type: "sql-script"
      skipped: false
      parameters:
        componentName: "insert into ODS"
        sqlScript: "insert into ODS.PUSHMOBILE \n                          (\n   \
          \                         CLIENTID,\n                            HASH_ID,\
          \ \n                            appname, \n                            messagename\
          \ ,\n                            messageid ,\n                         \
          \   campaigns ,\n                            deviceid ,\n              \
          \              datetimesend ,\n                            messagecontent\
          \ ,\n                            messageopened ,\n                     \
          \       opendate , \n                            timeinapp ,\n         \
          \                   platform ,\n                            platformversion\
          \ ,\n                            status ,\n                            serviceresponse\
          \ ,\n                            geofencename ,\n                      \
          \      template ,\n                            format ,\n              \
          \              pagename ,\n                            pushjobid ,\n   \
          \                         systemtoken ,\n                            INBOXDOWNLOAD\
          \ ,\n                            INBOXOPEN,\n                          \
          \  iosmediaurl ,\n                           androidmediaurl ,\n       \
          \                     mediaalt ,\n                            contactkey,\n\
          \                            \"RequestId\"\n                           )\n\
          select \n                          client_id,\n                        \
          \   HASH_ID, \n                           \"AppName\", \n              \
          \             \"MessageName\",\n                           \"MessageID\"\
          ,\n                           \"Campaigns\",\n                         \
          \  \"DeviceId\",\n                            \"DateTimeSend\",\n      \
          \                     \"MessageContent\",\n                           \"\
          MessageOpened\",\n                           \"OpenDate\", \n          \
          \                 \"TimeInApp\",\n                           \"Platform\"\
          ,\n                           \"PlatformVersion\",\n                   \
          \        \"Status\",\n                           \"ServiceResponse\",\n\
          \                           \"GeofenceName\",\n                        \
          \   \"Template\",\n                           \"Format\",\n            \
          \               \"PageName\",\n                           \"PushJobId\"\
          ,\n                           \"SystemToken\",\n                       \
          \    \"InboxMessageDownloaded\",\n                           \"InboxMessageOpened\"\
          ,\n                           \"IosMediaUrl\",\n                       \
          \   \"AndroidMediaUrl\",\n                           \"MediaAlt\",\n   \
          \                        \"ContactKey\",\n                            \"\
          RequestId\"\nfrom \"STG\".PUSH_MOBILE_AUTO_TMP\nwhere HASH_ID not in \n\t\
          (\n      select  HASH_ID\n      from ods.pushmobile\n    )"
    TMP TABLE  & CALCU HASH_ID ANCIENNE TABLE:
      type: "sql-script"
      transitions:
        success:
        - "insert into ODS"
      skipped: false
      parameters:
        componentName: "TMP TABLE  & CALCU HASH_ID ANCIENNE TABLE"
        sqlScript: "CREATE OR REPLACE TABLE \"STG\".PUSH_MOBILE_AUTO_TMP \n\nAS select\
          \ \n                          '${v_user_2}' AS client_id,\n            \
          \            MD5_HEX (to_varchar (ifnull(\"AppName\",'')||ifnull(\"MessageName\"\
          ,'')||ifnull(\"DeviceId\",'')||ifnull(\"ContactKey\",'')||ifnull(\"MessageID\"\
          ,''))) as HASH_ID, \n                           \"AppName\", \n        \
          \                   \"MessageName\",\n                           \"MessageID\"\
          ,\n                           \"Campaigns\",\n                         \
          \  \"DeviceId\",\n                           to_timestamp_ntz(replace (replace\
          \ (to_varchar (\"DateTimeSend\"),'AM', ''),'PM', ''), 'mm/dd/yyyy hh24:mi:ss')\
          \ as \"DateTimeSend\",\n                           \"MessageContent\",\n\
          \                           \"MessageOpened\",\n                       \
          \    \"OpenDate\", \n                           \"TimeInApp\",\n       \
          \                    \"Platform\",\n                           \"PlatformVersion\"\
          ,\n                           \"Status\",\n                           \"\
          ServiceResponse\",\n                           \"GeofenceName\",\n     \
          \                      \"Template\",\n                           \"Format\"\
          ,\n                           \"PageName\",\n                          \
          \ \"PushJobId\",\n                           \"SystemToken\",\n        \
          \                   \"InboxMessageDownloaded\",\n                      \
          \     \"InboxMessageOpened\",\n                           \"IosMediaUrl\"\
          ,\n                          \"AndroidMediaUrl\",\n                    \
          \       \"MediaAlt\",\n                           \"ContactKey\",\n    \
          \                        \"RequestId\"\nfrom stg.pushmobile_automation;\n\
          \n\n\n\nupdate   \"PUSHMOBILE\" \nset HASH_ID = MD5_HEX (to_varchar (ifnull(AppName,'')||ifnull(MessageName,\
          \ '')||ifnull(DeviceId,'')||ifnull(ContactKey,'')|| ifnull(messageid,'')));\n\
          \n\n"
    Copy of Data Transfer 0:
      type: "data-transfer-object"
      skipped: false
      parameters:
        componentName: "Copy of Data Transfer 0"
        sourceType: "SFTP"
        setHomeDirectoryAsRoot1: "No"
        sourceUrl6: "sftp://${v_user_2}@${v_host_2}/Export/DataChain/vpvpb_pushmobile_${date_du_jour}"
        sourceUsername3: "${v_user_2}"
        sourcePassword3: ""
        sourceSftpKey: ""
        unpackZipFile: "Yes"
        targetType: "S3"
        gzipData: "No"
        targetUrl2: "s3://jp-prod-datachain/Marketing-Cloud/PushMobile/"
        accessControlListOptions: ""
        encryption: "None"
  variables:
    v_pwd_2:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: ""
    v_host_2:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: ""
    v_user_2:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: ""
    date_du_jour:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "20230624"
